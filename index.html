<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSRANK STUDIO - We Design Brands That Rank</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}
h1,h2,h3{font-family:'Space Grotesk',sans-serif}
a{text-decoration:none;color:inherit}
.container{max-width:1100px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid #222;position:sticky;top:0;background:#0a0a0a;z-index:10}
.logo{font-family:'Space Grotesk';font-weight:700;font-size:22px;letter-spacing:2px}
.logo span{color:#FFD60A}
.nav-links{display:flex;gap:24px;font-size:14px;opacity:0.8}
.btn{background:#FFD60A;color:#000;padding:12px 24px;font-weight:700;font-family:'Space Grotesk';border-radius:4px;display:inline-block;transition:0.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,214,10,0.3)}
.hero{padding:80px 0 60px;display:grid;grid-template-columns:1.2fr 0.8fr;gap:40px;align-items:center}
.hero h1{font-size:56px;line-height:1.0;margin-bottom:16px}
.hero h1 em{font-style:normal;color:#FFD60A}
.hero p{opacity:0.7;font-size:18px;margin-bottom:28px;max-width:480px}
